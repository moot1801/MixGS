# Model Parameters
model_params: {
    model_config: {
        name: "GaussianModel",
        kwargs: {}
    },
    sh_degree: 3,
    source_path: "data/mill19/rubble-pixsfm/train",
    pretrain_path: "data/coarse_gaussians/rubble_point_cloud.ply",
    model_path: "output/rubble_stage_budget_smoke_mixgs",
    images: "images",
    resolution: 4,
    white_background: False,
    data_device: "cuda",
    eval: True,
    llffhold: None,
    detail_max_slots: 5,
    detail_count_choices: [0, 1, 2, 4, 8, 16, 32],
    hash_args: {
        canonical_num_levels: 32,
        canonical_level_dim: 2,
        canonical_base_resolution: 32,
        canonical_desired_resolution: 2048,
        canonical_log2_hashmap_size: 22,
        bound: 202.19
    },
    network_args: {
      depth: 1,
      width: 32,
    }
}

# Pipeline Parameters
pipeline_params: {
    convert_SHs_python:  False,
    compute_cov3D_python:  False,
    debug:  False,
    scale_min: 0.0005,
    # Fixed base budget; effective budget is reduced after joint_start_iter.
    render_gaussian_budget: 8388608,
    stage_budget_adjustment: True,
    stage_budget_initial_scale: 0.75,
    stage_budget_min_scale: 0.10,
    stage_budget_safety_scale: 0.95,
    stage_budget_grow_factor: 1.02,
    resource_log_interval: 100,
    resource_plot_on_complete: True,
}

# Optimization Parameters
optim_params: {
    iterations: 3_400,
    joint_start_iter: 1_700,
    position_lr_init: 0.0000064,
    position_lr_final: 0.000000064,
    position_lr_delay_mult: 0.01,
    position_lr_max_steps: 3_400,
    decoder_lr_max_steps: 3_400,
    feature_lr: 0.00025,
    opacity_lr: 0.005,
    scaling_lr: 0.0005,
    rotation_lr: 0.0001,
    # removed: percent_dense: 0.01,
    lambda_dssim: 0.2,
    opacity_thr: 0.5,
    encoder_lr_scale: 600.0,
    decoder_lr_scale: 80.0,
}
