# Model Parameters
model_params: {
    model_config: {
        name: "GaussianModel",
        kwargs: {}
    },
    sh_degree: 3,
    source_path: "data/mill19/rubble-pixsfm/train",
    pretrain_path: "data/coarse_gaussians/rubble_point_cloud.ply",
    model_path: "output/rubble_clone_score_200_4",
    images: "images",
    resolution: 4,
    white_background: False,
    data_device: "cuda",
    eval: True,
    llffhold: None,
    detail_max_slots: 4,
    detail_count_choices: [0, 1, 2, 3, 4],
    hash_args: {
        canonical_num_levels: 32,
        canonical_level_dim: 2,
        canonical_base_resolution: 32,
        canonical_desired_resolution: 2048,
        canonical_log2_hashmap_size: 22,
        bound: 202.19
    },
    network_args: {
      depth: 1,
      width: 32,
    }
}

# Pipeline Parameters
pipeline_params: {
    convert_SHs_python:  False,
    compute_cov3D_python:  False,
    debug:  False,
    scale_min: 0.0005,
    allocation_mode: "clone_score",
    detail_feature_mode: "detail_hash",
    render_gaussian_budget: -1,
    clone_score_warmup_until: 20_000,
    clone_score_ramp_until: 40_000,
    clone_score_freeze_after: 220_000,
    clone_score_ema_beta: 0.95,
    clone_score_eps: 1e-6,
    clone_score_detail_grad_weight: 1.0,
    clone_score_grad_clip: 0.0,
    resource_log_interval: 100,
    resource_plot_on_complete: True,
    metric_log_interval: 10_000,
}

# Optimization Parameters
optim_params: {
    iterations: 250_000,
    joint_start_iter: 50_000,
    position_lr_init: 0.0000064,
    position_lr_final: 0.000000064,
    position_lr_delay_mult: 0.01,
    position_lr_max_steps: 250_000,
    decoder_lr_max_steps: 250_000,
    feature_lr: 0.00025,
    opacity_lr: 0.005,
    scaling_lr: 0.0005,
    rotation_lr: 0.0001,
    lambda_dssim: 0.2,
    opacity_thr: 0.5,
    encoder_lr_scale: 600.0,
    decoder_lr_scale: 80.0,
}
